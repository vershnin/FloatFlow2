server:
  port: 8080

spring:
  application:
    name: FloatFlow

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/floatflow_db
    username: floatflow_user
    password: floatflow_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      pool-name: FloatFlowPool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
    open-in-view: false

jwt:
  # Base64-encoded secret — required by JJWT 0.12.6
  # Decodes to: floatflowsupersecretjwtkeyforHS256algorithmatleast32byteslong1234
  secret: ZmxvYXRmbG93c3VwZXJzZWNyZXRqd3RrZXlmb3JIUzI1NmFsZ29yaXRobWF0bGVhc3QzMmJ5dGVzbG9uZzEyMzQ=
  expiration: 86400000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.floatflow: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
